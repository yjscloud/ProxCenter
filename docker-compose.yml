# ============================================================================
#  ProxCenter — 一键部署文件
#
#  宿主上**只需要 Docker**（不用装 Node / Python / MySQL）：
#
#      docker compose up -d
#
#  然后浏览器打开  http://<服务器IP>:8080
#  账号 admin，口令 = 本文件里 ADMIN_PASSWORD 的默认值 ProxCenter@2026。
#
# ============================================================================
#  ★ 自定义口令
# ============================================================================
#
# ── 一、口令行里的 ${...} 是什么意思？ ───────────────────────────────────────
#
#   本文件里的口令是这样写的：
#
#       ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ProxCenter@2026}
#
#   把它拆成几段看，就知道哪部分是口令、哪部分只是语法：
#
#       ${                   固定开头，不是口令的一部分
#       ADMIN_PASSWORD       变量名：.env / 环境变量里要找的那个名字
#       :-                   分隔符，含义是「前面那个变量没给值就用后面的」
#       ProxCenter@2026      默认值  ← **这才是当前真正的口令**
#       }                    固定结尾，不是口令的一部分
#
#   整句读作：
#       「如果 .env 或环境变量里给了 ADMIN_PASSWORD，就用那里的；
#         没给（或给了空值），才用后面的 ProxCenter@2026。」
#
#   ⚠ 所以口令是 `ProxCenter@2026`，
#     `-`、`$`、`{`、`}` 都只是语法符号，不属于口令。
#
# ── 二、怎么改成自己的口令（只改 `:-` 后面、`}` 前面那一段）──────────────────
#
#   把「默认值」那段换掉即可，前面 `${变量名:-` 和结尾的 `}` 都不要动：
#
#       改之前：  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ProxCenter@2026}
#       改之后：  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-MyPassw0rd2026}
#
#   也就是说：把 `ProxCenter@2026` 换成 `MyPassw0rd2026`，其余原样保留。
#
#   数据库那两处同理（同样只换 `:-` 后面、`}` 前面的那一段）：
#
#       DB_PASSWORD:         ${DB_PASSWORD:-ProxCenter-Db-2026}
#       MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ProxCenter-Root-2026}
#
#   三处改完执行：  docker compose up -d
#
# ── 三、不想看见 ${...}？也可以整行写成纯值 ──────────────────────────────────
#
#       ADMIN_PASSWORD: MyPassw0rd2026
#
#   效果完全一样，代价是不再支持用 .env 覆盖。两种写法二选一，别混着用。
#
# ── 四、或者完全不改本文件，用 .env 覆盖（优先级更高）───────────────────────
#
#       cp .env.docker.example .env     # 里面已列好这几项，照着填即可
#       docker compose up -d
#
# ============================================================================
#  ★ 两个必须知道的前提
# ============================================================================
#
# 1) 口令只在「首次初始化」时生效，这两条务必看清：
#    · ADMIN_PASSWORD 只在库里还没有管理员时用来建号。已经部署并登录过的实例，
#      再改这里**不会**改变现有登录口令 —— 请登录后在
#      「个人中心 → 修改密码」里改（管理员也可在「设置 → 用户管理」重置）。
#    · 数据库口令只在 MySQL 数据目录为空时初始化。跑起来之后再改，要么
#      `docker compose down -v` 重建（**会清空数据**）、要么进库用 ALTER USER
#      手动改（文件末尾有现成命令），否则面板会连不上库、容器反复重启。
#
# 2) SECRET_KEY 请保持留空：容器首次启动会随机生成并保存到 panel_data 卷。
#    它既是登录 JWT 的签名密钥，也是库里密文（PVE Token / SMTP 口令）的加密根 ——
#    已有数据后改掉它，那些密文就全部解不开了。
#    确实想自己指定，就填一个 ≥ 32 位的随机串（一次性，之后别再动）。
# ============================================================================

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # ★ 改这里 —— MySQL 管理员（root）口令。
      #   只改 `:-` 后面、`}` 前面那一段，例如：
      #       MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-你的口令}
      #   只在数据库首次初始化时生效（之后改它不会改变已有数据库的口令）。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ProxCenter-Root-2026}

      # 数据库名与账号：一般不用改，改了下面 panel 会跟着变（同一个变量）
      MYSQL_DATABASE: ${DB_NAME:-proxcenter_panel}
      MYSQL_USER: ${DB_USER:-proxcenter}

      # ★ 改这里 —— 面板连接数据库用的口令。
      #   只改 `:-` 后面、`}` 前面那一段，例如：
      #       MYSQL_PASSWORD: ${DB_PASSWORD:-你的口令}
      #   与下面 panel 的 DB_PASSWORD 是同一个变量，改这一处两边同步，
      #   不会出现「库口令和面板口令对不上」。
      MYSQL_PASSWORD: ${DB_PASSWORD:-ProxCenter-Db-2026}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # 等 MySQL 真正能接受连接，面板才启动，避免首启时反复重连
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  panel:
    # 镜像来源可用 PROXCENTER_IMAGE 覆盖（例如换成 Docker Hub 或固定版本号）
    image: ${PROXCENTER_IMAGE:-ghcr.io/yjscloud/proxcenter:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- 面板登录账号 -----------------------------------------------------
      # 登录用户名：除非有特别需要，保持 admin 即可
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}

      # ★ 改这里 —— 面板登录口令（上面的 admin 账号用它）。
      #   只改 `:-` 后面、`}` 前面那一段，例如：
      #       ADMIN_PASSWORD: ${ADMIN_PASSWORD:-你的口令}
      #   要求：至少 12 位，且不能是 admin123 / password 这类弱口令，
      #   否则后端会拒绝启动。只在首次建号时使用；已部署过的实例请到
      #   「个人中心 → 修改密码」改。
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ProxCenter@2026}

      # --- 密钥 -------------------------------------------------------------
      # `${SECRET_KEY:-}` 就是「没给就用空值」：留空时容器会首次启动随机生成
      # 并保存到 panel_data 卷（推荐）。已有数据后**绝不要**修改，否则库里
      # 已存的 PVE Token / SMTP 口令全部解不开。
      # 想自己指定：把 `${SECRET_KEY:-}` 换成 `${SECRET_KEY:-你的随机串}`，
      # 长度 ≥ 32 位。
      SECRET_KEY: ${SECRET_KEY:-}

      # --- 数据库（与上面 db 服务对应的值一致，一般不用改）-----------------
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-proxcenter}
      # 与上面 db 的 MYSQL_PASSWORD 是同一个变量，改那一处即可
      DB_PASSWORD: ${DB_PASSWORD:-ProxCenter-Db-2026}
      DB_NAME: ${DB_NAME:-proxcenter_panel}

      # --- 监听与反代 -------------------------------------------------------
      PORT: "8080"
      # 由 Nginx/Caddy 终结 TLS 时置 true：明文一律 308 跳 https，并加 HSTS
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      # uvicorn 信任哪些来源的 X-Forwarded-Proto。反代若跑在宿主机 / 另一容器，
      # 来源不是 127.0.0.1 —— 需按实际网关地址填写；* 表示信任全部（仅内网反代时用）。
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}

      # --- 可选：Proxmox 连接初始值（登录后也能在「设置」页在线修改）---------
      PVE_HOST: ${PVE_HOST:-}
      PVE_PORT: ${PVE_PORT:-8006}
      PVE_TOKEN_ID: ${PVE_TOKEN_ID:-}
      PVE_TOKEN_SECRET: ${PVE_TOKEN_SECRET:-}
      PVE_VERIFY_SSL: ${PVE_VERIFY_SSL:-true}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 面板对外的端口。宿主机 8080 被占用时只改这个默认值，例如 18080。
      - "${PANEL_PORT:-8080}:8080"
    volumes:
      # 面板运行期数据 + 自动生成的 SECRET_KEY：必须持久化，别删
      - panel_data:/app/backend/data
      # --- 可选：把宿主机目录挂进来，才能使用「主机安全」类功能 --------------
      # 安全基线 / SSH 防爆破 / 端口进程巡检读的是**面板所在主机**的日志与 /proc。
      # 容器里默认看不到宿主机的这些数据，相关页面会提示「读取不到」。需要时按
      # 注释挂载（只读挂载，面板不会写宿主机系统文件）：
      # - /var/log:/var/log:ro
      # - /etc/fail2ban:/etc/fail2ban:ro
      # - /proc:/host/proc:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db_data:
  panel_data:

# ============================================================================
#  改完口令后怎么确认生效
#
#      docker compose up -d          # 应用改动（重建容器）
#      docker compose ps             # panel 应该是 Up (healthy)
#      浏览器打开 http://<服务器IP>:8080，用 admin + 你设的 ADMIN_PASSWORD 登录
#
#  如果 panel 起不来或反复重启，多半是数据库口令对不上，看日志：
#
#      docker compose logs panel | tail -30     # 找 Access denied / Can't connect
#
#  此时两种补救：
#      · 数据可以不要 → docker compose down -v && docker compose up -d   # 重建
#      · 数据要保留   → 进库改口令（把 <新口令> 换成你本文件 / .env 里的值）：
#          docker compose exec db mysql -uroot -p
#          > ALTER USER 'proxcenter'@'%'         IDENTIFIED BY '<新口令>';
#          > ALTER USER 'proxcenter'@'localhost' IDENTIFIED BY '<新口令>';
#          > FLUSH PRIVILEGES;
# ============================================================================
