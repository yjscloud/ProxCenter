# ProxCenter — Docker 镜像构建与发布
#
# 目的：把「构建镜像 → 推送到公共仓库」这件事自动化，用户直接 `docker compose up -d`
# 就能跑，不需要在本地装 Node / Python / MySQL。
#
# 推送目标（两个都推，用户按网络情况自取）：
#   * GHCR（ghcr.io/<owner>/proxcenter）—— 用仓库自带的 GITHUB_TOKEN，**零配置**即可用；
#     注意：GHCR 的包默认是 private，首次发布后要到
#     「GitHub → 个人/组织 → Packages → proxcenter → Package settings」里改成 Public。
#   * Docker Hub（<DOCKERHUB_USERNAME>/proxcenter）—— 需在仓库 Secrets 里配置
#     DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN 才会推；没配就自动跳过，不影响 GHCR。
#
# 触发：
#   * push 到 main        → 产出 :edge / :main / :sha-xxxx
#   * push tag v1.2.3     → 产出 :1.2.3 / :1.2 / :latest / :sha-xxxx
#   * 手动 workflow_dispatch → 同 main
name: Docker 镜像

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "构建目标平台；需要 arm64 时填 linux/amd64,linux/arm64"
        default: linux/amd64

# 同一分支连推时取消未完成的旧构建
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # 只构建 amd64。Proxmox VE 本身只有 x86_64（官方没有 arm64 版本），面板不可能跑在
  # arm64 的 PVE 宿主机上；而 GHA 上 arm64 要走 QEMU 模拟，实测一次多架构构建 24 分钟
  # 都跑不完 —— 为用不上的架构付这个代价不划算。
  # 确实需要 arm64（例如只想在 ARM 机器上管理远程 PVE），用 workflow_dispatch 手动触发
  # 并把 platforms 填成 linux/amd64,linux/arm64 即可。
  PLATFORMS: linux/amd64

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # 推 GHCR 必需

    # 注意：secrets 上下文**不能**直接用在 if 条件里 —— 写 `if: secrets.X != ''`
    # 会让 GitHub 判定整个 workflow 文件不合法，表现为「运行里一个 job 都没有」。
    # 所以先映射成 job 级 env，再用 env 判断（env 上下文在 if 里是允许的）。
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      # QEMU 让 x86 runner 能构建 arm64；buildx 是多架构构建的入口
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 推送目标清单：GHCR 必推，Docker Hub 配了密钥才加进去。
      # 用一个步骤拼出来，而不是在 metadata-action 里写死两个 —— 否则没配 Docker Hub
      # 时会生成 `/proxcenter` 这种非法镜像名，导致整个构建失败。
      - name: 组装推送目标
        id: targets
        run: |
          {
            echo "list<<EOF"
            # GHCR 要求镜像名全小写，而 GitHub 仓库名可能含大写字母
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "${DOCKERHUB_USERNAME}/proxcenter"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub（配了密钥才执行）
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.list }}
          tags: |
            type=edge,branch=main
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # 手动触发时可以覆盖（push 事件下 inputs 为空，回落到 env.PLATFORMS）
          platforms: ${{ inputs.platforms || env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          # gha 缓存：复用上一次的分层，明显加快重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 多架构下关掉 provenance/sbom：它们会额外挂一个 unknown/unknown 平台的
          # 证明清单，在 Docker Hub 页面上看着像多了个平台，容易让用户困惑。
          provenance: false
          sbom: false

      - name: 输出镜像地址
        run: |
          {
            echo "### 已推送镜像"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
